name: Softprobe OBI Image and System E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: softprobe-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-ci-image:
    name: Build and publish Softprobe OBI image
    if: >-
      github.repository == 'softprobe/opentelemetry-ebpf-instrumentation' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == 'softprobe/opentelemetry-ebpf-instrumentation')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publish sp-obi CI image to GHCR
    outputs:
      target_sha: ${{ steps.vars.outputs.target_sha }}
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Compute target SHA and tags
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          full_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          image_base="ghcr.io/softprobe/opentelemetry-ebpf-instrumentation/sp-obi"
          if [ "${EVENT_NAME}" = "push" ]; then
            primary_tag="${image_base}:sha-${full_sha}"
            tags="${primary_tag},${image_base}:edge-main"
          else
            primary_tag="${image_base}:ci-${full_sha}"
            tags="${primary_tag}"
          fi
          {
            echo "target_sha=${full_sha}"
            echo "short_sha=${short_sha}"
            echo "image_tag=${primary_tag}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Softprobe OBI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RELEASE_VERSION=${{ steps.vars.outputs.short_sha }}
            RELEASE_REVISION=${{ steps.vars.outputs.short_sha }}
            SP_OBI_REV=${{ steps.vars.outputs.target_sha }}

  dispatch-system-e2e:
    name: Trigger Softprobe System E2E
    needs: publish-ci-image
    if: github.repository == 'softprobe/opentelemetry-ebpf-instrumentation'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Dispatch system-e2e workflow when org token is configured
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TARGET_SHA: ${{ needs.publish-ci-image.outputs.target_sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_PAT secret is not configured on this public repository; skipping cross-repo dispatch to private softprobe/dev."
            exit 0
          fi
          dispatch_ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run system-e2e.yml \
            --repo softprobe/dev \
            -f override_repo=sp-obi \
            -f override_ref="${TARGET_SHA}"
          run_id=""
          for _ in $(seq 1 24); do
            sleep 5
            run_id="$(gh run list \
              --repo softprobe/dev \
              --workflow system-e2e.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt,displayTitle \
              --jq "[.[] | select(.createdAt >= \"${dispatch_ts}\")][0].databaseId // empty")"
            if [ -n "${run_id}" ]; then
              break
            fi
          done
          if [ -z "${run_id}" ]; then
            echo "Failed to locate dispatched system-e2e run on softprobe/dev." >&2
            exit 1
          fi
          gh run watch "${run_id}" --repo softprobe/dev --exit-status
