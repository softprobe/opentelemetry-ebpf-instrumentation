name: Softprobe PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**", "feat/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: softprobe-pr-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate BPF bindings
        run: make docker-generate
      - name: Run Softprobe-critical Go unit tests
        run: go test -count=1 ./pkg/obi ./pkg/appolly/discover ./pkg/internal/ebpf/generictracer
      - name: Build Linux amd64 OBI binary
        run: GOOS=linux GOARCH=amd64 go build -o /tmp/obi ./cmd/obi

  java-agent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Java agent unit tests
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/tmp/.gradle \
            -v "${{ github.workspace }}:/src" \
            -w /src/pkg/internal/java \
            gradle:9.8.2-jdk21-noble \
            gradle :agent:test --no-daemon
