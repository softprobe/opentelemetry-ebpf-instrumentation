services:
  softprobe-gateway:
    image: alpine:3.21
    cap_add:
      - BPF
      - SYS_ADMIN
    command:
      - /usr/local/bin/obi
      - softprobe-gateway
      - --mode
      - ${SOFTPROBE_GATEWAY_MODE:-record}
      - --listen
      - 0.0.0.0:15001
      - --app-id
      - travel-ota
      - --upstream
      - https://spair.softprobe.ai
      - --trace-api
      - http://sp-dev-app:8090/v1/traces
      - --record-api
      - http://sp-dev-app:8090/api/storage/record/query
      - --postgres-listen
      - 0.0.0.0:5432
      - --postgres-upstream
      - postgres:5432
      - --postgres-database
      - travel_orders
      - --mysql-listen
      - 0.0.0.0:3306
      - --mysql-upstream
      - mysql:3306
    volumes:
      - ../../bin/obi:/usr/local/bin/obi:ro
      - /sys/fs/bpf:/sys/fs/bpf:ro
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - default
      - sp-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:15001/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  softprobe-ingress:
    image: alpine:3.21
    command:
      - /usr/local/bin/obi
      - softprobe-ingress
      - --listen
      - 0.0.0.0:15002
      - --app-id
      - travel-ota
      - --upstream
      - http://travel-ota:8080
      - --trace-api
      - http://sp-dev-app:8090/v1/traces
      - --record-api
      - http://sp-dev-app:8090/api/storage/record/query
    ports:
      - "18080:15002"
    volumes:
      - ../../bin/obi:/usr/local/bin/obi:ro
    depends_on:
      - travel-ota
    networks:
      - default
      - sp-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:15002/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  travel-ota:
    image: eclipse-temurin:21-jre
    command: ["java", "-jar", "/opt/app/travel-ota.jar"]
    depends_on:
      softprobe-gateway:
        condition: service_healthy
    environment:
      AIRLINE_NDC_BASE_URL: "http://softprobe-gateway:15001/ndc/v21.3"
      OTEL_SERVICE_NAME: "travel-ota"
      SPRING_PROFILES_ACTIVE: "obi-replay"
    volumes:
      - ../../../demo-ota/travel-ota/target/travel-ota-1.0-SNAPSHOT.jar:/opt/app/travel-ota.jar:ro
    networks:
      - default
      - sp-backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel_orders
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: softprobe
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_orders"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - default

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: travel_payments
      MYSQL_ROOT_PASSWORD: softprobe
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 20s
    networks:
      - default

  obi:
    image: alpine:3.21
    command: ["/usr/local/bin/obi", "--config", "/etc/obi.yaml"]
    privileged: true
    pid: "service:travel-ota"
    depends_on:
      - travel-ota
    volumes:
      - ../../bin/obi:/usr/local/bin/obi:ro
      - ./obi.yaml:/etc/obi.yaml:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/kernel/tracing:/sys/kernel/tracing
    networks:
      - default
      - sp-backend

volumes:
  postgres_data:
  mysql_data:

networks:
  default:
  sp-backend:
    external: true
    name: sp-dev_sp-dev
