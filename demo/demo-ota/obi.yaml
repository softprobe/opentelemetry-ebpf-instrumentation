file_format: "1.0"

tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://sp-dev-app:8090/v1/traces
            encoding: protobuf
        schedule_delay: 2000

extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
      rules:
        - action: include
          match:
            process:
              exe_path_glob:
                - "*/java"
      instrumentation:
        record_payloads: true
        http:
          enabled:
            traces: true
            metrics: false
      runtimes:
        java:
          enabled: true
      engine:
        propagation:
          context_propagation: headers
