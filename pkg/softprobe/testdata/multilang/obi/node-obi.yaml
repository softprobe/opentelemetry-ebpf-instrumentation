file_format: "1.0"
extensions:
  obi:
    version: "2.0"
    capture:
      policy:
        default_action: exclude
        match_order: first_match_wins
        poll_interval: 500ms
        min_process_age: 0s
      rules:
        - action: include
          name: multilang-node
          description: Capture Node.js Express fixture
          match:
            process:
              exe_path_glob:
                - "*node*"
    softprobe:
      enabled: true
      app_id: multilang-node
      backend_url: http://multilang-backend:8090
      record_rate: 1.0
      max_body_bytes: 262144
